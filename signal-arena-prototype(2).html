<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SIGNAL ARENA — UX-прототип · карта экранов</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#0B0C0D;--panel:#111315;--surf:#181B1E;--surf2:#212528;--surf3:#2B3034;
 --bd:rgba(255,255,255,.12);--bd2:rgba(255,255,255,.22);--bd3:rgba(255,255,255,.34);
 --tx:#F1F3F4;--tx2:#989EA4;--tx3:#666C72;
 --acid:#C8F135;--cyan:#57D2E6;--mag:#FF4D8D;--amber:#F2B33D;--red:#E9605A;--green:#5FCB8B;--violet:#A98BE8;
 --mono:"SFMono-Regular",Menlo,Consolas,monospace;
 --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:16px/1.5 var(--ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--tx3)}

/* ============ SHELL ============ */
.shell{display:grid;grid-template-rows:auto 1fr;height:100vh;overflow:hidden}
.appbar{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;border-bottom:1px solid var(--bd);background:var(--panel);flex:0 0 auto}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-size:14px;letter-spacing:.16em;text-transform:uppercase}
.brand span{font-family:var(--mono);font-size:10px;color:var(--tx3);letter-spacing:.08em}
.spacer{flex:1}
.tgl{display:flex;gap:6px;flex-wrap:wrap}
.tgl button{border:1px solid var(--bd);border-radius:7px;padding:6px 11px;font-family:var(--mono);font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);min-height:32px}
.tgl button:hover{border-color:var(--bd3);color:var(--tx)}
.tgl button[aria-pressed="true"]{background:var(--acid);border-color:var(--acid);color:#12140A;font-weight:600}
.counter{font-family:var(--mono);font-size:10.5px;color:var(--tx3);white-space:nowrap}

.main{display:grid;grid-template-columns:286px minmax(0,1fr) 348px;min-height:0}

/* ============ NAV ============ */
.nav{border-right:1px solid var(--bd);background:var(--panel);overflow-y:auto;padding:14px 0 40px}
.nav .find{margin:0 14px 12px;position:relative}
.nav .find input{width:100%;background:var(--surf);border:1px solid var(--bd);border-radius:8px;padding:9px 11px;color:var(--tx);font-size:13px;min-height:38px}
.nav .find input::placeholder{color:var(--tx3)}
.grp{margin:0 0 4px}
.grp>h3{display:flex;align-items:center;gap:8px;padding:9px 16px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3)}
.grp>h3 i{width:16px;height:16px;border:1px solid var(--bd2);border-radius:4px;display:grid;place-items:center;font-style:normal;font-size:9px;color:var(--tx2)}
.nav a{display:grid;grid-template-columns:34px 1fr;align-items:center;gap:6px;padding:7px 16px 7px 16px;font-size:13px;color:var(--tx2);text-decoration:none;border-left:2px solid transparent;min-height:36px}
.nav a em{font-family:var(--mono);font-size:10px;font-style:normal;color:var(--tx3)}
.nav a:hover{background:var(--surf);color:var(--tx)}
.nav a.on{background:var(--surf2);color:var(--tx);border-left-color:var(--acid)}
.nav a.on em{color:var(--acid)}

/* ============ STAGE ============ */
.stage{overflow-y:auto;padding:24px;display:flex;flex-direction:column;align-items:center;gap:16px;background:
  linear-gradient(0deg,transparent 23px,rgba(255,255,255,.022) 24px),
  linear-gradient(90deg,transparent 23px,rgba(255,255,255,.022) 24px);background-size:24px 24px}
.shead{width:100%;max-width:640px;display:flex;align-items:flex-start;gap:14px}
.shead .id{font-family:var(--mono);font-size:11px;color:var(--acid);border:1px solid rgba(200,241,53,.4);border-radius:6px;padding:4px 8px;flex:0 0 auto}
.shead h2{font-size:17px;font-weight:600;line-height:1.3}
.shead p{font-size:12.5px;color:var(--tx2);margin-top:3px}
.pager{display:flex;gap:8px;align-items:center;flex:0 0 auto;margin-left:auto}
.pager button{border:1px solid var(--bd);border-radius:7px;width:34px;height:34px;color:var(--tx2);font-size:14px}
.pager button:hover{border-color:var(--bd3);color:var(--tx)}

/* ============ DEVICE ============ */
.dev{width:390px;height:844px;flex:0 0 auto;border:1px solid var(--bd2);border-radius:36px;background:#0D0F10;position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.5),0 18px 50px rgba(0,0,0,.45)}
.dev:before{content:"";position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:22px;border-radius:12px;background:#000;z-index:60}
.scr{position:absolute;inset:0;display:flex;flex-direction:column}
.sbar{height:40px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 3px;font-family:var(--mono);font-size:10px;color:var(--tx2)}
.body{flex:1;min-height:0;overflow-y:auto;padding:0 14px 14px;display:flex;flex-direction:column;gap:10px}
.body::-webkit-scrollbar{width:0}
.body.pad0{padding:0 0 14px}

/* topbar in-app */
.tb{display:flex;align-items:center;gap:6px;padding:6px 0 8px;position:sticky;top:0;background:linear-gradient(#0D0F10 70%,rgba(13,15,16,0));z-index:20}
.ava{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd2);flex:0 0 auto;display:grid;place-items:center;font-size:11px;color:var(--tx2)}
.xpwrap{flex:1;min-width:0;border:1px solid var(--bd);border-radius:8px;padding:4px 7px;background:var(--surf)}
.xpwrap .r{display:flex;justify-content:space-between;font-family:var(--mono);font-size:8.5px;color:var(--tx2);letter-spacing:.06em}
.bar{height:4px;border-radius:3px;background:var(--surf3);margin-top:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acid)}
.bar.c i{background:var(--cyan)}.bar.m i{background:var(--mag)}.bar.a i{background:var(--amber)}.bar.g i{background:var(--green)}.bar.r i{background:var(--red)}
.chip{border:1px solid var(--bd);border-radius:7px;padding:4px 6px;font-family:var(--mono);font-size:9.5px;color:var(--tx2);background:var(--surf);white-space:nowrap;flex:0 0 auto}
.ico{width:28px;height:28px;border:1px solid var(--bd);border-radius:8px;display:grid;place-items:center;font-size:11px;color:var(--tx2);background:var(--surf);flex:0 0 auto;position:relative}
.ico b{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border-radius:50%;background:var(--mag)}

/* bottom nav */
.bn{flex:0 0 auto;height:64px;border-top:1px solid var(--bd);background:var(--panel);display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding-bottom:6px}
.bn a{display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(--mono);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);text-decoration:none;padding-top:4px}
.bn a i{font-style:normal;font-size:15px;line-height:1;opacity:.75}
.bn a.on{color:var(--acid)}
.bn a.on i{opacity:1}
.bn a.mid i{width:38px;height:38px;border-radius:12px;border:1px solid rgba(200,241,53,.45);background:rgba(200,241,53,.1);display:grid;place-items:center;margin-top:-14px}

/* ============ PRIMITIVES ============ */
.card{border:1px solid var(--bd);border-radius:10px;background:var(--surf);padding:10px}
.card.q{background:var(--surf2)}
.card.dash{border-style:dashed;background:transparent}
.h{font-size:13px;font-weight:600;line-height:1.25}
.h2{font-size:11.5px;font-weight:600;color:var(--tx)}
.t{font-size:11px;color:var(--tx2);line-height:1.45}
.t3{font-size:10px;color:var(--tx3);line-height:1.4}
.big{font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.sec{display:flex;align-items:center;gap:8px;margin-top:2px}
.sec .ln{flex:1;height:1px;background:var(--bd)}
.row{display:flex;gap:8px}
.row.w{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ph{border:1px dashed var(--bd2);border-radius:8px;background:
  repeating-linear-gradient(135deg,rgba(255,255,255,.03) 0 6px,transparent 6px 12px);
  display:grid;place-items:center;font-family:var(--mono);font-size:9px;color:var(--tx3);letter-spacing:.08em;text-align:center;padding:6px}
.btn{border:1px solid var(--bd2);border-radius:9px;padding:9px 10px;font-size:11.5px;font-weight:600;text-align:center;background:var(--surf2);min-height:40px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:1.2}
.btn.pri{background:var(--acid);border-color:var(--acid);color:#12140A}
.btn.gho{background:transparent}
.btn.sm{min-height:30px;padding:5px 9px;font-size:10.5px;font-weight:500}
.btn.dis{opacity:.42}
.tag{border:1px solid var(--bd2);border-radius:20px;padding:3px 8px;font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--tx2);white-space:nowrap}
.tag.ac{border-color:rgba(200,241,53,.5);color:var(--acid);background:rgba(200,241,53,.08)}
.tag.cy{border-color:rgba(87,210,230,.5);color:var(--cyan);background:rgba(87,210,230,.08)}
.tag.mg{border-color:rgba(255,77,141,.5);color:var(--mag);background:rgba(255,77,141,.08)}
.tag.am{border-color:rgba(242,179,61,.5);color:var(--amber);background:rgba(242,179,61,.08)}
.tag.gr{border-color:rgba(95,203,139,.5);color:var(--green);background:rgba(95,203,139,.08)}
.tag.rd{border-color:rgba(233,96,90,.5);color:var(--red);background:rgba(233,96,90,.08)}
.tag.vi{border-color:rgba(169,139,232,.5);color:var(--violet);background:rgba(169,139,232,.08)}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:10.5px;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.kv:last-child{border-bottom:0}
.kv span{color:var(--tx2)}
.kv b{font-weight:600;font-family:var(--mono);font-size:10px}
.ov{position:absolute;left:0;right:0;bottom:0;top:0;background:rgba(6,7,8,.72);z-index:40;display:flex;align-items:flex-end}
.sheet{width:100%;border-radius:16px 16px 0 0;border:1px solid var(--bd2);border-bottom:0;background:var(--panel);padding:12px 14px 18px;display:flex;flex-direction:column;gap:9px;max-height:78%;overflow-y:auto}
.sheet .grab{width:34px;height:3px;border-radius:2px;background:var(--bd3);margin:0 auto 4px}
.modal{position:absolute;inset:0;background:rgba(6,7,8,.74);z-index:45;display:grid;place-items:center;padding:20px}
.modal>div{width:100%;border:1px solid var(--bd2);border-radius:14px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:10px}

/* browser widget */
.bw{border:1px solid var(--bd2);border-radius:10px;background:var(--surf);overflow:hidden}
.bw .chr{display:flex;align-items:center;gap:5px;padding:6px 7px;border-bottom:1px solid var(--bd);background:var(--surf2)}
.bw .dots{display:flex;gap:3px;margin-right:2px}
.bw .dots i{width:6px;height:6px;border-radius:50%;background:var(--bd3);display:block}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1}
.tabs::-webkit-scrollbar{height:0}
.tab{border:1px solid var(--bd);border-radius:6px 6px 0 0;border-bottom:0;padding:4px 7px;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;color:var(--tx3);white-space:nowrap;background:var(--surf);display:flex;align-items:center;gap:4px;min-height:26px}
.tab.on{color:#12140A;background:var(--acid);border-color:var(--acid);font-weight:700}
.tab.lk{opacity:.45;border-style:dashed}
.bw .url{padding:5px 9px;border-bottom:1px solid var(--bd);font-family:var(--mono);font-size:8.5px;color:var(--tx3);display:flex;justify-content:space-between}
.bw .view{padding:9px}

/* chart */
.ch{position:relative;height:112px;border:1px solid var(--bd);border-radius:8px;background:#101315;overflow:hidden}
.ch svg{display:block;width:100%;height:100%}
.ch .t0{position:absolute;top:0;bottom:0;border-left:1px dashed var(--mag);width:0}
.ch .t0 b{position:absolute;top:4px;left:4px;font-family:var(--mono);font-size:7.5px;color:var(--mag);white-space:nowrap;background:rgba(13,15,16,.85);padding:1px 3px;border-radius:3px}
.ch .hid{position:absolute;top:0;bottom:0;right:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.05) 0 5px,transparent 5px 10px);border-left:1px dashed var(--bd3);display:grid;place-items:center}
.ch .hid span{font-family:var(--mono);font-size:7.5px;color:var(--tx3);transform:rotate(90deg);white-space:nowrap;letter-spacing:.1em}

/* skill cards */
.sk{border:1px solid var(--bd2);border-radius:9px;background:var(--surf2);padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:74px;justify-content:center;position:relative}
.sk .gl{width:26px;height:26px;border:1px dashed var(--bd3);border-radius:6px;display:grid;place-items:center;font-size:12px;color:var(--tx2)}
.sk .nm{font-family:var(--mono);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--tx);text-align:center;line-height:1.2}
.sk .cost{position:absolute;top:3px;right:4px;font-family:var(--mono);font-size:7px;color:var(--tx3)}
.sk.on{border-color:var(--acid);background:rgba(200,241,53,.1)}
.sk.on .nm{color:var(--acid)}
.sk.lk{opacity:.4;border-style:dashed}
.sk.rd{border-color:rgba(233,96,90,.5)}

/* decisions 2x2 */
.dec{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.dec .d{border:1px solid var(--bd2);border-radius:9px;background:var(--surf2);padding:8px;min-height:52px;display:flex;flex-direction:column;gap:2px;justify-content:center}
.dec .d .k{font-family:var(--mono);font-size:8px;color:var(--tx3)}
.dec .d .v{font-size:11px;font-weight:600;line-height:1.25}
.dec .d.on{border-color:var(--acid);background:rgba(200,241,53,.11)}
.dec .d.on .v{color:var(--acid)}

/* score */
.score{display:flex;align-items:center;gap:12px}
.dial{width:76px;height:76px;flex:0 0 auto;border-radius:50%;border:2px solid var(--bd2);display:grid;place-items:center;position:relative;background:conic-gradient(var(--acid) 0 78%,var(--surf3) 78% 100%)}
.dial i{position:absolute;inset:6px;border-radius:50%;background:var(--surf);display:grid;place-items:center;font-style:normal;font-family:var(--mono);font-size:19px;font-weight:700;color:var(--acid)}
.dial i s{text-decoration:none;font-size:9px;color:var(--tx3)}
.axes{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.ax{display:grid;grid-template-columns:64px 1fr 26px;gap:6px;align-items:center;font-family:var(--mono);font-size:8.5px;color:var(--tx2)}

/* misc lists */
.li{display:flex;gap:8px;align-items:center;border:1px solid var(--bd);border-radius:9px;background:var(--surf);padding:8px}
.li .lead{width:30px;height:30px;flex:0 0 auto;border:1px dashed var(--bd2);border-radius:7px;display:grid;place-items:center;font-size:12px;color:var(--tx2)}
.li .mid{flex:1;min-width:0}
.li .mid .a{font-size:11.5px;font-weight:600;line-height:1.25}
.li .mid .b{font-size:9.5px;color:var(--tx3);margin-top:1px}
.li .end{flex:0 0 auto;text-align:right}
.node{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.node .o{width:34px;height:34px;border-radius:50%;border:1px solid var(--bd2);display:grid;place-items:center;font-size:12px;color:var(--tx2);background:var(--surf2)}
.node.done .o{border-color:var(--green);color:var(--green)}
.node.cur .o{border-color:var(--acid);color:var(--acid);box-shadow:0 0 0 3px rgba(200,241,53,.12)}
.node.lk .o{border-style:dashed;opacity:.5}
.node .cap{font-family:var(--mono);font-size:7.5px;text-align:center;color:var(--tx3);line-height:1.2;max-width:62px}
.link{height:1px;background:var(--bd2);flex:0 0 12px;margin-top:17px}
.ent{border:1px solid var(--bd);border-radius:9px;background:var(--surf);overflow:hidden}
.ent .art{height:66px;border-bottom:1px solid var(--bd);display:grid;place-items:center;font-family:var(--mono);font-size:8px;color:var(--tx3);background:repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 6px,transparent 6px 12px);text-align:center;padding:4px}
.ent .cap{padding:6px 7px}
.ent .cap .a{font-size:10px;font-weight:600;line-height:1.2}
.ent .cap .b{font-family:var(--mono);font-size:7.5px;color:var(--tx3);margin-top:2px}
.ent.lock .art{color:var(--tx3);opacity:.6}

/* annotation mode */
.dev.anno [data-z]{outline:1px dashed rgba(87,210,230,.75);outline-offset:1px;position:relative}
.dev.anno [data-z]:after{content:attr(data-z);position:absolute;top:-1px;left:-1px;background:var(--cyan);color:#04191D;font-family:var(--mono);font-size:8px;font-weight:700;padding:1px 3px;border-radius:0 0 4px 0;z-index:35;line-height:1.3;pointer-events:none}
.dev.grid .scr:before{content:"";position:absolute;inset:0;z-index:30;pointer-events:none;
 background:linear-gradient(90deg,rgba(87,210,230,.16) 0 1px,transparent 1px);background-size:24px 100%;
 border-left:14px solid rgba(255,77,141,.09);border-right:14px solid rgba(255,77,141,.09)}

/* ============ SPEC PANEL ============ */
.spec{border-left:1px solid var(--bd);background:var(--panel);overflow-y:auto;padding:16px 16px 48px}
.spec h4{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
.spec h4:first-child{margin-top:0}
.spec h4 .ln{flex:1;height:1px;background:var(--bd)}
.spec p{font-size:12.5px;color:var(--tx2);line-height:1.5}
.zt{width:100%;border-collapse:collapse}
.zt td{border-bottom:1px solid rgba(255,255,255,.07);padding:6px 4px;vertical-align:top;font-size:11.5px;line-height:1.4}
.zt td:first-child{width:26px}
.zt .zc{display:inline-grid;place-items:center;min-width:20px;height:18px;border-radius:4px;background:var(--cyan);color:#04191D;font-family:var(--mono);font-size:9px;font-weight:700;padding:0 3px}
.zt .zn{color:var(--tx);font-weight:600}
.zt .zg{font-family:var(--mono);font-size:9.5px;color:var(--tx3);display:block;margin-top:2px}
.rules{display:flex;flex-direction:column;gap:7px}
.rule{display:flex;gap:8px;font-size:11.5px;color:var(--tx2);line-height:1.45}
.rule i{font-style:normal;color:var(--acid);flex:0 0 auto;font-family:var(--mono);font-size:10px;margin-top:2px}
.rule.no i{color:var(--red)}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--bd);border-radius:7px;padding:6px 9px;font-size:11px;color:var(--tx2);min-height:32px}
.jump button:hover{border-color:var(--cyan);color:var(--cyan)}
.states{display:flex;flex-wrap:wrap;gap:6px}

/* ============ OVERVIEW ============ */
.ovw{padding:24px;overflow-y:auto;grid-column:1/-1}
.stage>.ovw{align-self:stretch;width:100%;box-sizing:border-box}
.main.ovwmode{grid-template-columns:286px minmax(0,1fr)}
.ovw .gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:22px}
.mini{cursor:pointer}
.mini .box{width:196px;height:425px;overflow:hidden;border-radius:19px;border:1px solid var(--bd2);position:relative;background:#0D0F10}
.mini .box .dev{transform:scale(.503);transform-origin:top left;box-shadow:none;border:0}
.mini .cap{margin-top:7px;font-size:11.5px;line-height:1.3}
.mini .cap em{font-family:var(--mono);font-size:9.5px;color:var(--acid);font-style:normal;display:block}
.mini:hover .box{border-color:var(--acid)}
.ovh{display:flex;align-items:baseline;gap:12px;margin:26px 0 14px}
.ovh b{font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.ovh .ln{flex:1;height:1px;background:var(--bd)}
.ovh span{font-family:var(--mono);font-size:10px;color:var(--tx3)}

@media (max-width:1280px){.main{grid-template-columns:240px minmax(0,1fr) 300px}}

    </div>

  </header>
  <div class="main" id="main">
    <nav class="nav" id="nav"></nav>
    <div class="stage" id="stage"></div>

</div>
<script>
/* ===================== SIGNAL ARENA · PROTOTYPE ENGINE ===================== */
const H = (s) => s;

/* ---------- candle chart (deterministic pseudo-random) ---------- */
function candles(seed, n, hidePct) {
  let s = seed;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  let p = 50, out = [];
  for (let i = 0; i < n; i++) {
    const d = (rnd() - 0.46) * 9;
    const o = p, c = Math.max(8, Math.min(92, p + d));
    const hi = Math.max(o, c) + rnd() * 5, lo = Math.min(o, c) - rnd() * 5;
    out.push([o, c, hi, lo]); p = c;
  }
  const w = 100 / n;
  const body = out.map((k, i) => {
    const x = i * w + w * .5, up = k[1] >= k[0];
    const col = up ? '#5FCB8B' : '#E9605A';
    const y1 = 100 - k[2], y2 = 100 - k[3];
    const by = 100 - Math.max(k[0], k[1]), bh = Math.max(1.4, Math.abs(k[1] - k[0]));
    return '<line x1="' + x + '" x2="' + x + '" y1="' + y1 + '" y2="' + y2 + '" stroke="' + col + '" stroke-width="' + (w * .12) + '" vector-effect="non-scaling-stroke"/>' +
      '<rect x="' + (i * w + w * .2) + '" y="' + by + '" width="' + (w * .6) + '" height="' + bh + '" fill="' + col + '" opacity="' + (up ? .85 : .8) + '"/>';
  }).join('');
  const grid = [20, 40, 60, 80].map(y => '<line x1="0" x2="100" y1="' + y + '" y2="' + y + '" stroke="rgba(255,255,255,.055)" stroke-width=".4"/>').join('');
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' + grid + body + '</svg>';
}
function chart(o) {
  o = o || {};
  const hide = o.hide === undefined ? 34 : o.hide;
  const t0 = o.t0 === undefined ? 66 : o.t0;
  return '<div class="ch"' + (o.z ? ' data-z="' + o.z + '"' : '') + ' style="height:' + (o.h || 112) + 'px">' +
    candles(o.seed || 7, o.n || 28) +
    (t0 !== null ? '<div class="t0" style="left:' + t0 + '%"><b>' + (o.t0label || 't₀ · ТОЧКА РЕШЕНИЯ') + '</b></div>' : '') +
    (hide > 0 ? '<div class="hid" style="width:' + hide + '%"><span>БУДУЩЕЕ СКРЫТО</span></div>' : '') +
    '</div>';
}

/* ---------- shared chrome ---------- */
function sbar() { return '<div class="sbar"><span>9:41</span><span>●●● ▾ ■</span></div>'; }

function topbar(o) {
  o = o || {};
  return '<div class="tb" data-z="' + (o.z || '1') + '">' +
    '<div class="ava">☠</div>' +
    '<div class="xpwrap"><div class="r"><span>LVL 42 · XP</span><span>12 450 / 18 000</span></div><div class="bar"><i style="width:69%"></i></div></div>' +
    '<span class="chip">◉ 2 345</span>' +
    (o.sig === false ? '' : '<span class="chip">$SIG 128</span>') +
    '<div class="ico">⚑<b></b></div><div class="ico">⚙</div></div>';
}

function taskbar(o) {
  o = o || {};
  return '<div class="tb" data-z="' + (o.z || '1') + '">' +
    '<div class="ico">‹</div>' +
    '<div class="xpwrap"><div class="r"><span>' + (o.label || 'СЦЕНАРИЙ 14/40') + '</span><span>' + (o.right || 'ПРАВИЛО · СНАЧАЛА РИСК') + '</span></div><div class="bar c"><i style="width:' + (o.pct || 35) + '%"></i></div></div>' +
    '<span class="chip">◉ 2 345</span>' +
    '<div class="ico">?</div><div class="ico">⚙</div></div>';
}

const NAVITEMS = [['⌂', 'ГЛАВНАЯ', '2.1'], ['☉', 'ОБУЧЕНИЕ', '4.1'], ['▷', 'ПРАКТИКА', '3.1'], ['⚠', 'УГРОЗЫ', '5.1'], ['⋯', 'ЕЩЁ', '11.1']];
function bnav(active, z) {
  return '<div class="bn"' + (z ? ' data-z="' + z + '"' : ' data-z="N"') + '>' + NAVITEMS.map((it, i) =>
    '<a href="#' + it[2] + '" class="' + (it[1] === active ? 'on ' : '') + '' + '"><i>' + it[0] + '</i>' + it[1] + '</a>'
  ).join('') + '</div>';
}

function sec(t, right) {
  return '<div class="sec"><span class="lbl">' + t + '</span><span class="ln"></span>' + (right ? '<span class="lbl">' + right + '</span>' : '') + '</div>';
}
function skill(n, sub, st, cost) {
  return '<div class="sk ' + (st || '') + '">' + (cost ? '<span class="cost">' + cost + '</span>' : '') +
    '<span class="gl">' + (st === 'lk' ? '⚿' : '◈') + '</span><span class="nm">' + n + '</span>' +
    (sub ? '<span class="t3" style="font-size:7.5px">' + sub + '</span>' : '') + '</div>';
}
function decisions(sel, opts, z) {
  const o = opts || ['Войти на пробое', 'Ждать ретест', 'Сократить риск', 'Остаться вне рынка'];
  return '<div class="dec"' + (z ? ' data-z="' + z + '"' : '') + '>' + o.map((v, i) =>
    '<div class="d' + (sel === i ? ' on' : '') + '"><span class="k">' + 'ABCD'[i] + '</span><span class="v">' + v + '</span></div>'
  ).join('') + '</div>';
}
function browser(o) {
  o = o || {};
  const tabs = o.tabs || [['ГРАФИК', 'on'], ['ОБЪЁМ', ''], ['НОВОСТИ', ''], ['СОЦФОН', ''], ['+', 'lk']];
  return '<div class="bw"' + (o.z ? ' data-z="' + o.z + '"' : '') + '>' +
    '<div class="chr"><span class="dots"><i></i><i></i><i></i></span><div class="tabs">' +
    tabs.map(t => '<span class="tab ' + t[1] + '">' + t[0] + '</span>').join('') + '</div></div>' +
    '<div class="url"><span>' + (o.url || 'arena://btc-perp/15m') + '</span><span>' + (o.meta || 'АРХИВ') + '</span></div>' +
    '<div class="view">' + (o.view || chart({})) + '</div></div>';
}

/* ---------- generic screen wrapper ---------- */
function screen(inner, nav, cls) {
  return '<div class="scr' + (cls ? ' ' + cls : '') + '">' + sbar() + '<div class="body">' + inner + '</div>' + (nav === null ? '' : bnav(nav)) + '</div>';
}

/* ===================== SCREENS ===================== */
const S = [];
function add(o) { S.push(o); }

/* ---------------- 0. ВХОД ---------------- */
add({
  id: '1.1', grp: '0 · ВХОД И КАЛИБРОВКА', title: 'Загрузочный экран',
  desc: 'Первый кадр. Задаёт тон и сразу снимает ожидание «заработка».',
  render: () => '<div class="scr">' + sbar() + '<div class="body" style="justify-content:center;gap:18px;padding:0 26px 40px">' +
    '<div class="ph" style="height:120px" data-z="1">ЛОГОТИП · ЗНАК<br>240×120</div>' +
    '<div style="text-align:center" data-z="2"><div class="big" style="font-size:26px;letter-spacing:.06em">SIGNAL ARENA</div>' +
    '<div class="lbl" style="margin-top:6px">ТРЕНАЖЁР РЕШЕНИЙ · НЕ БИРЖА</div></div>' +
    '<div class="card q" data-z="3"><div class="t" style="text-align:center">Загрузка архива рыночных катастроф…</div><div class="bar" style="margin-top:8px"><i style="width:62%"></i></div>' +
    '<div class="t3" style="text-align:center;margin-top:7px">Датасет v2.4 · хэш проверен</div></div>' +
    '<div style="flex:1"></div>' +
    '<div class="t3" style="text-align:center" data-z="4">Игра не даёт торговых сигналов и не обещает дохода.<br>Внутригровые ресурсы не выводятся.</div>' +
    '</div></div>',
  zones: [['1', 'Лого-блок', 'center, y 180–300, ш 240'], ['2', 'Вордмарк + теглайн', 'center, y 318–370'], ['3', 'Индикатор загрузки + версия датасета', 'x 26, ш 338, h 72'], ['4', 'Правовой дисклеймер (постоянный)', 'bottom, y 772–820']],
  rules: [['§2', 'Никаких цитат про прибыль, графиков «вверх» и символов биржи'], ['§15', 'Версия датасета видна с первого кадра — честность по умолчанию']],
  states: ['Загрузка', 'Ошибка сети', 'Обновление датасета'], jumps: ['1.2']
});

add({
  id: '1.2', grp: '0 · ВХОД И КАЛИБРОВКА', title: 'Вход / регистрация',
  desc: 'Один экран, без разветвления. Гостевой вход доступен до первого сценария.',
  render: () => '<div class="scr">' + sbar() + '<div class="body" style="padding:24px 22px 30px;gap:12px">' +
    '<div class="lbl" data-z="1">ШАГ 1 ИЗ 3 · ДОСТУП</div>' +
    '<div class="big" data-z="2">ВХОД БЕСПЛАТНЫЙ</div><div class="t" style="margin-top:-4px">Выход обычно дороже. Но здесь он тоже бесплатный.</div>' +
    '<div class="col" style="margin-top:8px" data-z="3">' +
    '<div class="btn"> Продолжить с Apple</div><div class="btn">G Продолжить с Google</div>' +
    '<div class="btn gho">✉ Email</div></div>' +
    '<div class="row" style="align-items:center;gap:10px;margin:4px 0"><span class="ln" style="flex:1;height:1px;background:var(--bd)"></span><span class="lbl">ИЛИ</span><span class="ln" style="flex:1;height:1px;background:var(--bd)"></span></div>' +
    '<div class="btn gho" data-z="4">Играть без аккаунта · 3 сценария</div>' +
    '<div style="flex:1"></div>' +
    '<div class="card dash" data-z="5"><div class="t3">Продолжая, вы соглашаетесь с тем, что игра — обучающий тренажёр на исторических данных, а не инвестиционная рекомендация. Условия · Конфиденциальность</div></div>' +
    '</div></div>',
  zones: [['1', 'Индикатор шага воронки', 'x 22, y 46'], ['2', 'Заголовок + подзаголовок', 'x 22, ш 346'], ['3', 'Стек кнопок провайдеров', '3×40, gap 8'], ['4', 'Гостевой вход (лимит 3)', 'ш 346, h 40'], ['5', 'Правовой блок + ссылки', 'bottom, ш 346']],
  rules: [['§2', 'Нет привязки кошелька — вне MVP (§17)'], ['§13', 'Нет пейволла на входе']],
  states: ['Новый', 'Возврат', 'Гость → апгрейд'], jumps: ['1.3', '1.1']
});

add({
  id: '1.3', grp: '0 · ВХОД И КАЛИБРОВКА', title: 'Калибровка опыта',
  desc: 'Не тест и не урок. Решает, с какой плотности стартует контент и насколько сжат онбординг.',
  render: () => '<div class="scr">' + sbar() + '<div class="body" style="padding:18px 18px 26px;gap:10px">' +
    '<div class="row" style="align-items:center" data-z="1"><div class="ico">‹</div><div class="xpwrap"><div class="r"><span>ШАГ 2 ИЗ 3</span><span>КАЛИБРОВКА</span></div><div class="bar c"><i style="width:66%"></i></div></div></div>' +
    '<div class="big" data-z="2">СКОЛЬКО РАЗ ТЕБЯ УЖЕ ЛИКВИДИРОВАЛИ?</div>' +
    '<div class="t">От ответа не зависит ни оценка, ни доступ. Зависит только длина объяснений.</div>' +
    '<div class="col" style="margin-top:4px" data-z="3">' +
    ['Ни раза. Я тут первый день', 'Пару раз. Запомнилось', 'Регулярно. Ищу систему', 'Торгую профессионально']
      .map((v, i) => '<div class="btn' + (i === 2 ? ' pri' : ' gho') + '" style="justify-content:space-between"><span>' + v + '</span><span class="lbl" style="color:inherit;opacity:.6">L' + [0, 5, 18, 34][i] + '</span></div>').join('') + '</div>' +
    sec('ЧТО ТРЕНИРУЕШЬ В ПЕРВУЮ ОЧЕРЕДЬ', 'МАКС 2') +
    '<div class="g2" data-z="4">' + [['Входы', 'on'], ['Удержание', ''], ['Риск', 'on'], ['��сихология', ''], ['Шум и новости', ''], ['Web3-риски', '']]
      .map(v => '<div class="btn sm' + (v[1] ? ' pri' : ' gho') + '">' + v[0] + '</div>').join('') + '</div>' +
    '<div style="flex:1"></div>' +
    '<div class="row" data-z="5"><div class="btn gho" style="flex:1">Пропустить</div><div class="btn pri" style="flex:2">Дальше</div></div>' +
    '</div></div>',
  zones: [['1', 'Шаг + кнопка назад', 'y 40, h 32'], ['2', 'Вопрос (2 строки макс)', 'x 18, ш 354'], ['3', '4 варианта с меткой старт-уровня', 'h 40 каждый'], ['4', 'Цели тренировки (мультивыбор, до 2)', 'сетка 2×3'], ['5', 'Нижняя панель действий', 'sticky bottom, h 40']],
  rules: [['§3.1', 'Онбординг обязателен для всех, но объяснения пропускаемые'], ['§16.8', 'Профессионал не должен проходить курс про свечи']],
  states: ['Пусто', 'Выбрано', 'Лимит 2 достигнут'], jumps: ['2.1', '1.2']
});

/* ---------------- 1. ОНБОРДИНГ (прогрессивное раскрытие, §11) ---------------- */
const OB = [
  ['2.1', 'Шаг 1 · только текст ситуации', 'На экране живёт один элемент. Игрок усваивает: задание начинается с контекста, а не с графика.', 1],
  ['2.2', 'Шаг 2 · + вкладка графика', 'Появляется браузер с одной вкладкой и меткой t₀. Будущее сразу показано как скрытое.', 2],
  ['2.3', 'Шаг 3 · + второй источник', 'Вторая вкладка учит главному: источники могут противоречить друг другу.', 3],
  ['2.4', 'Шаг 4 · + первая карта навыка', 'Карта — не бонус и не подсказка ответа. Это принцип, который можно приложить к данным.', 4],
  ['2.5', 'Шаг 5 · + четыре решения', 'Кнопки встают на своё постоянное место — и больше никогда не переезжают.', 5],
  ['2.6', 'Шаг 6 · + разбор и оценка', 'Первое знакомство с главным правилом: исход рынка ≠ качество решения.', 6],
  ['2.7', 'Шаг 7 · + дополнительный шаг', 'Контекстная нижняя панель. Показывается один раз и с объяснением, почему она не всегда.', 7],
  ['2.8', 'Шаг 8 · + угрозы', 'Первая угроза названа и показана открыто — только на ранних уровнях.', 8],
  ['2.9', 'Шаг 9 · + правило решения', 'Правило задаёт критерий оценки сессии и становится частью топ-бара.', 9],
  ['2.10', 'Шаг 10 · полный каркас', 'Все категории вкладок раскрыты. Дальше меняется не каркас, а плотность задач.', 10]
];
const ALLTABS = [['ГРАФИК', 'on'], ['СТАРШИЙ TF', ''], ['ОБЪЁМ', ''], ['НОВОСТИ', ''], ['СОЦФОН', ''], ['МАКРО', ''], ['ON-CHAIN', ''], ['ПОЗИЦИЯ', ''], ['МОИ ПРАВИЛА', '']];

OB.forEach(([id, title, desc, lv]) => {
  add({
    id, grp: '1 · ОНБОРДИНГ · МЕХАНИКА', title, desc,
    render: () => {
      const tabs = lv < 2 ? null : (lv === 2 ? [['ГРАФИК', 'on']] : lv < 10 ? [['ГРАФИК', 'on'], ['ОБЪЁМ', ''], ['+', 'lk']] : ALLTABS);
      let x = '<div class="tb" data-z="1"><div class="ico">✕</div><div class="xpwrap"><div class="r"><span>ОНБОРДИНГ ' + lv + '/10</span><span>' + (lv >= 9 ? 'ПРАВИЛО · ТОЛЬКО ДОКАЗАТЕЛЬСТВА' : 'БЕЗ ОЦЕНКИ') + '</span></div><div class="bar c"><i style="width:' + lv * 10 + '%"></i></div></div><div class="ico">?</div></div>';
      x += '<div class="card q" data-z="2"><div class="h">ПРОБОЙ ЕСТЬ. ОБЪЁМА НЕТ.</div><div class="t" style="margin-top:3px">Цель: понять, что из этого следует. Рынок уже поблагодарил тебя за ликвидность.</div></div>';
      if (lv >= 8) x += '<div class="card" data-z="6" style="border-color:rgba(255,77,141,.4)"><div class="row" style="align-items:center"><div class="ph" style="width:38px;height:38px;flex:0 0 auto">АРТ</div><div style="flex:1"><div class="h2">FAKE BREAKOUT PHANTOM</div><div class="t3">Активная угроза · уровень 35</div></div><span class="tag mg">УГРОЗА</span></div></div>';
      if (tabs) x += browser({ z: '3', tabs, view: chart({ seed: 11, hide: lv >= 6 ? 0 : 34 }) + (lv >= 3 ? '<div class="card dash" style="margin-top:7px"><div class="lbl">ВКЛАДКА ОБЪЁМ · КРАТКИЙ СЛЕПОК</div><div class="t" style="margin-top:3px">Объём на пробое − 41% к среднему</div></div>' : '') });
      else x += '<div class="ph" style="height:150px" data-z="3">ЗОНА БРАУЗЕРА<br>ЗАРЕЗЕРВИРОВАНА, НО ПУСТА</div>';
      if (lv >= 4) {
        x += sec('КАРТЫ НАВЫКОВ', lv >= 10 ? '4 ДОСТУПНО' : '1 ДОСТУПНА');
        x += '<div class="g4" data-z="4">' + skill('ОБЪЁМ', 'чтение', 'on') +
          skill('СТАРШИЙ TF', 'чтение', lv >= 10 ? '' : 'lk') +
          skill('ЖДАТЬ', 'решение', lv >= 10 ? '' : 'lk') +
          skill('ЛИМИТ РИСКА', 'защита', lv >= 10 ? '' : 'lk') + '</div>';
      }
      if (lv >= 5) { x += sec('ОСНОВНОЕ РЕШЕНИЕ', 'ВСЕГДА 4'); x += decisions(lv >= 6 ? 1 : null, null, '5'); }
      if (lv === 7) x += '<div class="card" data-z="7" style="border-color:rgba(87,210,230,.45)"><div class="lbl" style="color:var(--cyan)">ДОПОЛНИТЕЛЬНЫЙ ШАГ · УСЛОВИЕ ОТМЕНЫ</div><div class="g2" style="margin-top:7px"><div class="btn sm gho">Закрытие под уровнем</div><div class="btn sm pri">Нет объёма на ретесте</div><div class="btn sm gho">Время вышло</div><div class="btn sm gho">Отмены нет</div></div></div>';
      if (lv >= 6) x += '<div class="card" data-z="8"><div class="row" style="justify-content:space-between"><span class="lbl">РАЗБОР</span><span class="tag ac">КАЧЕСТВО 78</span></div><div class="t" style="margin-top:6px">Факт: цена вернулась под уровень. Логика: пробой без объёма — приглашение. Приглашают не тебя.</div></div>';
      x += '<div style="flex:1;min-height:6px"></div>';

S.sort(function (a, b) {
  var pa = a.id.split('.').map(Number), pb = b.id.split('.').map(Number);
  return (pa[0] - pb[0]) || (pa[1] - pb[1]);
});

var $ = function (s) { return document.querySelector(s); };
var byId = function (id) { return S.find(function (s) { return s.id === id; }); };

var cur = S[0].id, anno = true, grid = false, ovw = false, filter = '';

function groups() {
  var out = [], map = {};
  S.forEach(function (s) {
    if (!map[s.grp]) { map[s.grp] = { name: s.grp, items: [] }; out.push(map[s.grp]); }
    map[s.grp].items.push(s);
  });
  return out;
}

function match(s) {
  if (!filter) return true;
  var q = filter.toLowerCase();
  return (s.id + ' ' + s.title + ' ' + (s.desc || '') + ' ' + s.grp).toLowerCase().indexOf(q) >= 0;
}

function renderNav() {
  var html = '<div class="find"><input id="q" placeholder="Поиск экрана, раздела, элемента" value="' + filter.replace(/"/g, '&quot;') + '"></div>';
  groups().forEach(function (g) {
    var items = g.items.filter(match);
    if (!items.length) return;
    html += '<div class="grp"><h3>' + g.name + '<i>' + items.length + '</i></h3>';
    items.forEach(function (s) {
      html += '<a data-go="' + s.id + '"' + (s.id === cur ? ' class="on"' : '') + '><em>' + s.id + '</em><span>' + s.title + '</span></a>';
    });
    html += '</div>';
  });
  $('#nav').innerHTML = html;
  var q = $('#q');
  q.addEventListener('input', function (e) { filter = e.target.value; renderNav(); $('#q').focus(); });
}

function devHtml(s) {
  return '<div class="dev' + (anno ? ' anno' : '') + (grid ? ' grid' : '') + '">' + s.render() + '</div>';
}

function renderStage() {
  var s = byId(cur);
  $('#stage').innerHTML = devHtml(s)
    + '<div class="cap">' + s.id + ' · ' + s.title + ' · 390×844 · контент-ширина 362</div>';
}

function renderSpec() {
  var s = byId(cur), all = S.length, idx = S.indexOf(s) + 1, h = '';
  h += '<h4>Экран ' + s.id + ' <i>' + idx + '/' + all + '</i></h4>';
  h += '<div class="t">' + s.title + '</div>';
  h += '<div class="t3">' + (s.desc || '') + '</div>';
  h += '<h4>Карта зон и геометрия</h4><div class="zt">';
  (s.zones || []).forEach(function (z) {
    h += '<div class="zc"><span class="zn">' + z[0] + '</span><span>' + z[1] + '</span><span class="zg">' + z[2] + '</span></div>';
  });
  h += '</div>';
  if (s.rules && s.rules.length) {
    h += '<h4>Правила ТЗ и ограничения</h4><div class="rules">';
    s.rules.forEach(function (r) {
      var no = r[0] === 'NO';
      h += '<div class="rule' + (no ? ' no' : '') + '"><b>' + (no ? '✗' : r[0]) + '</b><span>' + r[1] + '</span></div>';
    });
    h += '</div>';
  }
  if (s.states && s.states.length) {
    h += '<h4>Состояния экрана</h4><div class="states">';
    s.states.forEach(function (t) { h += '<span class="tag">' + t + '</span>'; });
    h += '</div>';
  }
  if (s.jumps && s.jumps.length) {
    h += '<h4>Переходы</h4>';
    s.jumps.forEach(function (id) {
      var t = byId(id);
      if (t) h += '<button class="jump" data-go="' + id + '">' + id + ' · ' + t.title + '</button>';
    });
  }
  h += '<h4>Как читать прототип</h4><div class="t3">Пунктирные рамки — зоны компоновки (кнопка «Аннотации»). «Сетка 24px» включает базовую сетку и поля 14px. «Все экраны» — карта всех разделов. Стрелки ← → листают экраны.</div>';
  $('#spec').innerHTML = h;
}

function renderOverview() {
  var h = '<div class="ovw">';
  groups().forEach(function (g) {
    var items = g.items.filter(match);
    if (!items.length) return;
    h += '<div class="ovh">' + g.name + ' <i>' + items.length + '</i></div><div class="gr">';
    items.forEach(function (s) {
      h += '<div class="mini" data-go="' + s.id + '"><div class="box">' + devHtml(s) + '</div>'
        + '<div class="cap"><em>' + s.id + '</em> ' + s.title + '</div></div>';
    });
    h += '</div>';
  });
  h += '</div>';
  $('#stage').innerHTML = h;
}

function renderSingle() {
  if (!document.getElementById('nav')) {
    $('#main').innerHTML = '<nav class="nav" id="nav"></nav><div class="stage" id="stage"></div><aside class="spec" id="spec"></aside>';
  }
  renderNav(); renderStage(); renderSpec();
}

function paint() {
  if (ovw) {
    $('#main').innerHTML = '<nav class="nav" id="nav"></nav><div class="stage" id="stage"></div>';
    renderNav(); renderOverview();
  } else {
    renderSingle();
  }
  $('#cnt').textContent = (S.indexOf(byId(cur)) + 1) + ' / ' + S.length + ' · ' + groups().length + ' разделов';
}

function go(id) {
  if (!byId(id)) return;
  cur = id;
  history.replaceState(null, '', '#' + id);
  if (ovw) { ovw = false; $('#tOvw').setAttribute('aria-pressed', 'false'); }
  paint();
  var st = $('#stage'); if (st) st.scrollTop = 0;
}

document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-go]');
  if (t) { go(t.getAttribute('data-go')); }
});

$('#tAnno').addEventListener('click', function () {
  anno = !anno; this.setAttribute('aria-pressed', String(anno)); paint();
});
$('#tGrid').addEventListener('click', function () {
  grid = !grid; this.setAttribute('aria-pressed', String(grid)); paint();
});
$('#tOvw').addEventListener('click', function () {
  ovw = !ovw; this.setAttribute('aria-pressed', String(ovw)); paint();
});

window.addEventListener('hashchange', function () {
  var id = location.hash.replace('#', '');
  if (id && byId(id) && id !== cur) go(id);
});

document.addEventListener('keydown', function (e) {
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  var i = S.indexOf(byId(cur));
  var n = e.key === 'ArrowRight' ? i + 1 : i - 1;
  if (n < 0) n = S.length - 1;
  if (n >= S.length) n = 0;
  go(S[n].id);
});
